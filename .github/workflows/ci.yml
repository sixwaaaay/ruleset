name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image (musl, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            zig-arch: x86_64
            triple: x86_64-unknown-linux-musl
            tag-suffix: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            zig-arch: aarch64
            triple: aarch64-unknown-linux-musl
            tag-suffix: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ZIG_ARCH=${{ matrix.zig-arch }}
            TARGET_TRIPLE=${{ matrix.triple }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/ruleset:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}-${{ matrix.tag-suffix }}
            ${{ secrets.DOCKERHUB_USER }}/ruleset:${{ github.sha }}-${{ matrix.tag-suffix }}