name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: Docker image (musl, arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          build-args: |
            ZIG_ARCH=aarch64
            TARGET_TRIPLE=aarch64-unknown-linux-musl
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/ruleset:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}-arm64
            ${{ secrets.DOCKERHUB_USER }}/ruleset:${{ github.sha }}-arm64
